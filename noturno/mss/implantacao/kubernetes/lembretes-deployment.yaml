apiVersion: apps/v1
kind: Deployment
metadata:
  name: lembretes-deployment-sub3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lembretes-sub3
  template:
    metadata:
      labels:
        app: lembretes-sub3
    spec:
      containers:
        - name: lembretes-sub3
          image: asbonato/lembretes-sub3
          resources:
            limits:
              memory: 256Mi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: lembretes-clusterip-service-sub3
spec:
  type: ClusterIP
  selector:
    app: lembretes-sub3
  ports:
    - name: lembretes-sub3
      protocol: TCP
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: lembretes-service-sub3
spec:
  type: NodePort
  selector:
    app: lembretes-sub3
  ports:
    - name: lembretes-sub3
      protocol: TCP
      port: 4000
      targetPort: 4000