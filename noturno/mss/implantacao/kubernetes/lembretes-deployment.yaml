apiVersion: apps/v1
kind: Deployment
metadata:
  name: lembretes-deployment-sub1
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: lembretes-sub1
  template:
    metadata:
      labels:
        app: lembretes-sub1
    spec:
      containers:
        - name: lembretes
          image: asbonato/lembretes-sub1
          imagePullPolicy: Never
          resources:
            limits:
              memory: 256Mi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: lembretes-clusterip-service-sub1
spec:
  selector:
    app: lembretes-sub1
  type: ClusterIP
  ports:
    - name: lembretes-sub1
      protocol: TCP
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: lembretes-service-sub1
spec:
  selector:
    app: lembretes-sub1
  type: NodePort
  ports:
    - name: lembretes-sub1
      protocol: TCP
      port: 4000
      targetPort: 4000